{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}
{% block page_title %}Add Employee{% endblock %}
{% block page_subtitle %}Create a new employee record{% endblock %}

{% block content %}
<div class="card" style="max-width:820px;">
  <form method="POST" enctype="multipart/form-data">
    <h3>Account Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Employee ID <span class="req">*</span></label>
        <input type="text" name="employee_id" value="{{ form.get('employee_id','') }}" required placeholder="EMP0123">
      </div>
      <div class="form-group">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" name="full_name" value="{{ form.get('full_name','') }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" value="{{ form.get('email','') }}" required>
      </div>
      <div class="form-group">
        <label>Temporary Password <span class="req">*</span></label>
        <input type="password" name="password" required minlength="8" placeholder="Min. 8 characters">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Role</label>
        <select name="role">
          <option value="employee" {{ 'selected' if form.get('role') == 'employee' }}>Employee</option>
          <option value="admin" {{ 'selected' if form.get('role') == 'admin' }}>HR / Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Profile Photo</label>
        <input type="file" name="profile_photo" accept=".png,.jpg,.jpeg,.gif">
      </div>
    </div>

    <div class="divider"></div>
    <h3>Job Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" value="{{ form.get('department','') }}" placeholder="Engineering">
      </div>
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" name="job_title" value="{{ form.get('job_title','') }}" placeholder="Software Engineer">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ form.get('phone','') }}">
      </div>
      <div class="form-group">
        <label>Date of Joining</label>
        <input type="date" name="joining_date" value="{{ form.get('joining_date','') }}">
      </div>
    </div>
    <div class="form-group">
      <label>Address</label>
      <textarea name="address">{{ form.get('address','') }}</textarea>
    </div>

    <div class="divider"></div>
    <h3>Salary Structure</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Basic Salary (₹)</label>
        <input type="number" name="basic_salary" value="{{ form.get('basic_salary','0') }}" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Allowance (₹)</label>
        <input type="number" name="allowance" value="{{ form.get('allowance','0') }}" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label>Deduction (₹)</label>
      <input type="number" name="deduction" value="{{ form.get('deduction','0') }}" min="0" step="0.01">
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button type="submit" class="btn btn-primary">Save Employee</button>
      <a href="{{ url_for('admin.employees') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
